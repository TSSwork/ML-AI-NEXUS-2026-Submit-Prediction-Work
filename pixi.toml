[workspace]
authors = ["Kenura Gunarathna <kenura.gunarathna@thenex.global>"]
channels = ["conda-forge"]
name = "ml-nexus-2026"
platforms = ["osx-arm64"]
version = "0.1.0"

# ---------------------------------------------------------------------------
# Everything lives in notebooks/final_model_report.ipynb -- it runs end to end
# from data/ and writes submissions/submission_13_core3_honest.csv.
# ---------------------------------------------------------------------------
[tasks]
lab = "jupyter lab"
report = "jupyter nbconvert --to notebook --execute --inplace notebooks/final_model_report.ipynb"

[dependencies]
python = ">=3.14.7,<3.15"
pandas = ">=3.0.5,<4"
numpy = ">=2.5.3,<3"
scikit-learn = ">=1.9.1,<2"
lightgbm = ">=4.7.0,<5"
jupyterlab = ">=4.6.3,<5"
ipykernel = ">=7.3.0,<8"
matplotlib = ">=3.11.1,<4"
seaborn = ">=0.13.2,<0.14"
catboost = ">=1.2.10,<2"
scipy = ">=1.18.1,<2"

[pypi-dependencies]
interpret = ">=0.7.8, <0.8"
